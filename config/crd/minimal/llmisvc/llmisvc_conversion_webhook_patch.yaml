# Patch to add conversion webhook configuration to LLMInferenceService CRD
# This enables automatic conversion across v1alpha1, v1alpha2, and v1beta1 (Hub) API versions
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: llminferenceservices.serving.kserve.io
  annotations:
    cert-manager.io/inject-ca-from: kserve/llmisvc-serving-cert
spec:
  conversion:
    strategy: Webhook
    webhook:
      clientConfig:
        service:
          name: llmisvc-webhook-server-service
          namespace: kserve
          path: /convert
          port: 443
      conversionReviewVersions:
        - v1
        - v1beta1
